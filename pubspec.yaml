# LLM-CONTEXT:BEGIN
# FILE: pubspec.yaml
# ROLE: Owns pubspec behavior within the application-core subsystem.
# DOMAIN: application-core
# SECURITY-INVARIANT: Preserve local-first privacy, bounded resource use, and explicit error handling.
# CHANGE-GUARD: Preserve public contracts, bounded inputs, lifecycle cleanup, and fail-closed behavior; run analysis and relevant tests after edits.
# DOCS: See /docs/llm-context-schema.md and the nearest mermaid.md architecture map.
# LLM-CONTEXT:END
name: naza_one
description: A private local-first Gemma chat, scanner, and food vision journal.
publish_to: none
version: 1.0.11+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  audioplayers: ^6.5.0
  cryptography: ^2.9.0
  crypto: ^3.0.6
  ffi: ^2.2.0
  file_picker: ^11.0.2
  file_selector: ^1.1.0
  http: ^1.6.0
  geolocator: ^14.0.2
  pedometer: ^4.1.1
  permission_handler: ^12.0.1
  record: ^6.1.2
  # Keep the current Flutter Gemma facade on all targets. The LiteRT-LM engine
  # is 1.3.1 at flutter_gemma 1.5.2; Windows builds generate a local
  # pubspec_overrides.yaml that selects the pre-v0.14 bridge (1.0.2) because
  # upstream LiteRT-LM v0.14/v0.15 regress Windows WebGPU/D3D12 (#2957).
  flutter_gemma: 1.5.2
  flutter_gemma_litertlm: 1.3.1
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  # Scanner-only, pinned Llama 3 Small runtime used by road/food classifiers
  # and the probabilistic harm filter. It is never exposed through Chat.
  llamadart: 0.8.17
  path_provider: ^2.1.6
  pqcrypto: ^0.4.0
  sqlite3: ^3.3.4
  shared_preferences: ^2.5.5
  xml: ^7.0.1
  flutter_markdown: ^0.7.7+1
  # FIPS 202 SHA3-256 for scanner defense-capsule digests. Keep the audited
  # implementation pinned; update deliberately after reviewing its changelog.
  pointycastle: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

msix_config:
  display_name: Naza One
  publisher_display_name: Graylan Janulis
  identity_name: GraylanJanulis.NazaOne
  msix_version: 1.0.11.0
  logo_path: assets/branding/naza_orb_512.png
  capabilities: internetClient, location
  store: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/backgrounds/
    - assets/branding/
    - assets/icons/
    - assets/particles/
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf

# Match the verified scanner source's llama.cpp ABI. Do not set a global local
# native path here: that source bundle contains only Linux libraries, while
# Naza One also builds for Android, iOS, macOS, and Windows. LlamaDart resolves
# the matching b10075 bundle for each target. Linux/Crostini can opt into the
# exact-source host build documented under tool/.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_tag: b10075
      llamadart_native_backends:
        platforms:
          linux-x64: [cpu]
