name: naza_one
description: A private local-first Gemma chat, scanner, and food vision journal.
publish_to: none
version: 1.0.9+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  cryptography: ^2.9.0
  crypto: ^3.0.6
  file_picker: ^11.0.2
  file_selector: ^1.1.0
  http: ^1.6.0
  # Keep the current Flutter Gemma facade on all targets. The LiteRT-LM engine
  # is 1.3.1 at flutter_gemma 1.5.2; Windows builds generate a local
  # pubspec_overrides.yaml that selects the pre-v0.14 bridge (1.0.2) because
  # upstream LiteRT-LM v0.14/v0.15 regress Windows WebGPU/D3D12 (#2957).
  flutter_gemma: 1.5.2
  flutter_gemma_litertlm: 1.3.1
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  pqcrypto: ^0.4.0
  sqlite3: ^3.3.4
  shared_preferences: ^2.5.5
  xml: ^7.0.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

msix_config:
  display_name: Naza One
  publisher_display_name: Graylan Janulis
  identity_name: GraylanJanulis.NazaOne
  msix_version: 1.0.10.0
  logo_path: assets/branding/naza_orb_512.png
  capabilities: internetClient
  store: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
