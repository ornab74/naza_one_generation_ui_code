# LLM-CONTEXT:BEGIN
# FILE: analysis_options.yaml
# ROLE: Owns analysis options behavior within the application-core subsystem.
# DOMAIN: application-core
# SECURITY-INVARIANT: Preserve local-first privacy, bounded resource use, and explicit error handling.
# CHANGE-GUARD: Preserve public contracts, bounded inputs, lifecycle cleanup, and fail-closed behavior; run analysis and relevant tests after edits.
# DOCS: See /docs/llm-context-schema.md and the nearest mermaid.md architecture map.
# LLM-CONTEXT:END
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - naza_one_asset_pack/**
    - test_archive/**

linter:
  rules:
    # These two rules are formatting preferences only. The advanced embedded
    # vector store intentionally uses an explicit private seed assignment and a
    # compact single-line hot-loop update. Do not let those style choices make
    # plain `flutter analyze --no-pub` fail CI.
    prefer_initializing_formals: false
    curly_braces_in_flow_control_structures: false
