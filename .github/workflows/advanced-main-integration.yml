name: Validate Advanced Main Integration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/advanced-memory-onboarding
    paths:
      - "lib/chat/**"
      - "lib/memory/**"
      - "lib/model/**"
      - "lib/onboarding/**"
      - "lib/settings/**"
      - "tool/patch_main_advanced.py"
      - ".github/workflows/advanced-main-integration.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  validate-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply guarded shell patch in disposable checkout
        run: python3 tool/patch_main_advanced.py

      - name: Format patched main
        run: dart format lib/main.dart

      - name: Resolve modern non-Windows dependency graph
        run: flutter pub get

      - name: Analyze patched shell and advanced modules
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/main.dart lib/chat lib/memory lib/model lib/onboarding lib/settings

      - name: Run advanced feature tests
        run: >-
          flutter test --no-pub
          test/embedded_vector_store_test.dart
          test/local_memory_service_test.dart
          test/history_metadata_repository_test.dart
          test/advanced_chat_coordinator_test.dart
          test/runtime_profile_test.dart
          test/advanced_chat_features_test.dart

      - name: Upload reviewed patched main.dart
        uses: actions/upload-artifact@v4
        with:
          name: guarded-main-dart
          path: lib/main.dart
          if-no-files-found: error
