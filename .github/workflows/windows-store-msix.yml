# LLM-CONTEXT:BEGIN
# FILE: .github/workflows/windows-store-msix.yml
# ROLE: Owns windows store msix behavior within the application-core subsystem.
# DOMAIN: application-core
# SECURITY-INVARIANT: Preserve local-first privacy, bounded resource use, and explicit error handling.
# CHANGE-GUARD: Preserve public contracts, bounded inputs, lifecycle cleanup, and fail-closed behavior; run analysis and relevant tests after edits.
# DOCS: See /docs/llm-context-schema.md and the nearest mermaid.md architecture map.
# LLM-CONTEXT:END
name: Build Microsoft Store MSIX

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime:
        description: Windows LiteRT-LM runtime preparation
        required: true
        default: stable-package
        type: choice
        options:
          - stable-package
          - modern-source-gpu

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"
  STORE_DISPLAY_NAME: "Naza One"
  STORE_PUBLISHER_DISPLAY_NAME: "Graylan Janulis"
  STORE_IDENTITY_NAME: "GraylanJanulis.NazaOne"
  WINDOWS_LITERTLM_BRIDGE: "1.3.1"
  WINDOWS_LITERTLM_SOURCE: "0.16.0"

jobs:
  store-msix:
    name: Microsoft Store MSIX x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Prepare optional modern Windows LiteRT-LM GPU runtime
        if: ${{ inputs.runtime == 'modern-source-gpu' }}
        shell: pwsh
        run: ./tool/prepare_windows_litertlm.ps1

      - name: Verify optional modern Windows LiteRT-LM runtime
        if: ${{ inputs.runtime == 'modern-source-gpu' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $markerPath = '.dart_tool/naza_windows_litertlm_provenance.json'
          if (-not (Test-Path $markerPath)) {
            throw 'Modern Windows LiteRT-LM provenance marker is missing.'
          }
          $marker = Get-Content $markerPath -Raw | ConvertFrom-Json
          if ($marker.flutter_gemma_litertlm -ne $env:WINDOWS_LITERTLM_BRIDGE) {
            throw "Unexpected Flutter bridge: $($marker.flutter_gemma_litertlm)"
          }
          if ($marker.litert_lm_source_version -ne $env:WINDOWS_LITERTLM_SOURCE) {
            throw "Unexpected LiteRT-LM source version: $($marker.litert_lm_source_version)"
          }
          if ($marker.windows_gpu_cache -ne ':nocache') {
            throw "Windows GPU cache mitigation is not active: $($marker.windows_gpu_cache)"
          }
          if ($marker.windows_gpu_compute -ne 'enabled') {
            throw "Windows GPU compute is not enabled: $($marker.windows_gpu_compute)"
          }
          Write-Host "Verified modern Windows runtime: bridge $($marker.flutter_gemma_litertlm), LiteRT-LM $($marker.litert_lm_source_version)."

      - name: Analyze Windows release sources
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run complete release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @('test/', 'test_archive/food_repository_test.dart',
            'test_archive/food_vision_logic_test.dart', 'test_archive/shelf_scanner_test.dart',
            'test_archive/security_kernel_test.dart', 'test_archive/post_quantum_export_test.dart',
            'test_archive/post_quantum_recovery_test.dart', 'test_archive/post_quantum_state_test.dart',
            'test_archive/pq_trust_policy_test.dart', 'test_archive/persistent_audit_test.dart',
            'test_archive/release_trust_test.dart')
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & flutter test --no-pub $tests
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          exit 1

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Build Microsoft Store MSIX
        shell: pwsh
        env:
          WINDOWS_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:WINDOWS_MSIX_PUBLISHER) {
            throw 'WINDOWS_MSIX_PUBLISHER is not configured in GitHub Actions secrets.'
          }

          $versionLine = Get-Content pubspec.yaml |
            Select-String '^version:' |
            Select-Object -First 1
          if (-not $versionLine) {
            throw 'pubspec version not found.'
          }

          $appVersion = (($versionLine.ToString() -replace '^version:\s*', '').Trim()).Split('+')[0]
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid pubspec version '$appVersion'; expected a.b.c."
          }
          $msixVersion = "$appVersion.0"
          Write-Host "Creating Microsoft Store MSIX version $msixVersion from pubspec version $appVersion."

          & dart run msix:create `
            --store `
            --display-name "$env:STORE_DISPLAY_NAME" `
            --publisher-display-name "$env:STORE_PUBLISHER_DISPLAY_NAME" `
            --identity-name "$env:STORE_IDENTITY_NAME" `
            --publisher "$env:WINDOWS_MSIX_PUBLISHER" `
            --version "$msixVersion" `
            --build-windows false `
            --sign-msix false `
            --output-name "naza-one-windows-store"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX creation failed with exit code ${LASTEXITCODE}"
          }

      - name: Validate generated manifest
        shell: pwsh
        env:
          WINDOWS_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Get-Content pubspec.yaml |
            Select-String '^version:' |
            Select-Object -First 1
          if (-not $versionLine) { throw 'pubspec version not found.' }
          $appVersion = (($versionLine.ToString() -replace '^version:\s*', '').Trim()).Split('+')[0]
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid pubspec version '$appVersion'; expected a.b.c."
          }
          $expectedMsixVersion = "$appVersion.0"

          $msixFiles = @(Get-ChildItem -Path build/windows -Recurse -Filter '*.msix')
          if ($msixFiles.Count -eq 0) { throw 'Generated MSIX was not found.' }
          if ($msixFiles.Count -ne 1) {
            throw "Expected exactly one generated MSIX, found $($msixFiles.Count): $($msixFiles.FullName -join ', ')"
          }
          $msix = $msixFiles[0]

          $makeAppx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter 'makeappx.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $makeAppx) {
            throw 'makeappx.exe was not found in the installed Windows SDK.'
          }

          Write-Host "Using MakeAppx: $($makeAppx.FullName)"
          $unpackDir = Join-Path $env:RUNNER_TEMP 'naza-one-msix-validation'
          Remove-Item -Path $unpackDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $unpackDir -Force | Out-Null

          & $makeAppx.FullName unpack /p $msix.FullName /d $unpackDir /o | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx unpack failed with exit code ${LASTEXITCODE}"
          }

          [xml]$manifest = Get-Content (Join-Path $unpackDir 'AppxManifest.xml') -Raw
          $publisherDisplayName = $manifest.Package.Properties.PublisherDisplayName
          $identityName = $manifest.Package.Identity.Name
          $publisher = $manifest.Package.Identity.Publisher
          $packageVersion = $manifest.Package.Identity.Version

          if ($publisherDisplayName -ne $env:STORE_PUBLISHER_DISPLAY_NAME) {
            throw "PublisherDisplayName is '$publisherDisplayName'; expected '$env:STORE_PUBLISHER_DISPLAY_NAME'."
          }
          if ($identityName -ne $env:STORE_IDENTITY_NAME) {
            throw "Identity name is '$identityName'; expected '$env:STORE_IDENTITY_NAME'."
          }
          if ($publisher -ne $env:WINDOWS_MSIX_PUBLISHER) {
            throw "Publisher is '$publisher'; it does not match WINDOWS_MSIX_PUBLISHER."
          }
          if ($packageVersion -ne $expectedMsixVersion) {
            throw "Package version is '$packageVersion'; expected '$expectedMsixVersion' from pubspec.yaml."
          }

          Write-Host "Validated PublisherDisplayName: $publisherDisplayName"
          Write-Host "Validated Identity Name: $identityName"
          Write-Host "Validated Publisher: $publisher"
          Write-Host "Validated Package Version: $packageVersion"

      - name: Upload validated Store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Naza-One-Microsoft-Store-MSIX
          retention-days: 3
          path: build/windows/**/*.msix
          if-no-files-found: error
