name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "assets/**"
      - "windows/**"
      - "tool/prepare_windows_litertlm.ps1"
      - ".github/workflows/windows-store-msix.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"
  STORE_DISPLAY_NAME: "Naza One"
  STORE_PUBLISHER_DISPLAY_NAME: "Graylan Janulis"
  STORE_IDENTITY_NAME: "GraylanJanulis.NazaOne"
  WINDOWS_LITERTLM_VERSION: "1.0.2"
  WINDOWS_LITERTLM_NATIVE: "0.13.1-a"

jobs:
  store-msix:
    name: Microsoft Store MSIX x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Windows LiteRT-LM GPU compatibility runtime
        shell: pwsh
        run: ./tool/prepare_windows_litertlm.ps1

      - name: Verify Windows LiteRT-LM compatibility runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content pubspec.lock -Raw
          $pattern = "(?ms)^  flutter_gemma_litertlm:\r?\n.*?^    version: \"([^\"]+)\""
          $match = [regex]::Match($lock, $pattern)
          if (-not $match.Success) {
            throw 'flutter_gemma_litertlm was not found in pubspec.lock after Windows compatibility preparation.'
          }
          $resolved = $match.Groups[1].Value
          Write-Host "Resolved flutter_gemma_litertlm: $resolved"
          if ($resolved -ne $env:WINDOWS_LITERTLM_VERSION) {
            throw "Windows build resolved flutter_gemma_litertlm $resolved; required compatibility version is $env:WINDOWS_LITERTLM_VERSION."
          }

          $markerPath = '.dart_tool/naza_windows_litertlm_patch.json'
          if (-not (Test-Path $markerPath)) { throw 'Windows LiteRT-LM patch marker is missing.' }
          $marker = Get-Content $markerPath -Raw | ConvertFrom-Json
          if ($marker.litert_lm_native -ne $env:WINDOWS_LITERTLM_NATIVE) {
            throw "Unexpected Windows native LiteRT-LM runtime: $($marker.litert_lm_native)"
          }
          if ($marker.windows_gpu_cache -ne ':nocache') {
            throw "Windows GPU weight-cache mitigation is not active: $($marker.windows_gpu_cache)"
          }

          $packageConfig = Get-Content '.dart_tool/package_config.json' -Raw | ConvertFrom-Json
          $package = $packageConfig.packages | Where-Object { $_.name -eq 'flutter_gemma_litertlm' } | Select-Object -First 1
          if (-not $package) { throw 'flutter_gemma_litertlm is missing from package_config.json.' }
          Write-Host "Windows LiteRT package root: $($package.rootUri)"
          Write-Host 'Verified Windows GPU compatibility: LiteRT-LM 0.13.1-a + :nocache (#2572/#2957).'

      - name: Analyze Windows release sources
        run: flutter analyze --no-pub

      - name: Run regression tests
        run: flutter test --no-pub

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Build Microsoft Store MSIX
        shell: pwsh
        env:
          WINDOWS_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:WINDOWS_MSIX_PUBLISHER) {
            throw 'WINDOWS_MSIX_PUBLISHER is not configured in GitHub Actions secrets.'
          }

          & dart run msix:create `
            --store `
            --display-name "$env:STORE_DISPLAY_NAME" `
            --publisher-display-name "$env:STORE_PUBLISHER_DISPLAY_NAME" `
            --identity-name "$env:STORE_IDENTITY_NAME" `
            --publisher "$env:WINDOWS_MSIX_PUBLISHER" `
            --build-windows false `
            --sign-msix false `
            --output-name "naza-one-windows-store"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX creation failed with exit code $LASTEXITCODE"
          }

      - name: Validate generated manifest
        shell: pwsh
        env:
          WINDOWS_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -Path build/windows -Recurse -Filter '*.msix' | Select-Object -First 1
          if (-not $msix) { throw 'Generated MSIX was not found.' }

          $makeAppx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter 'makeappx.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $makeAppx) {
            throw 'makeappx.exe was not found in the installed Windows SDK.'
          }

          Write-Host "Using MakeAppx: $($makeAppx.FullName)"
          $unpackDir = Join-Path $env:RUNNER_TEMP 'naza-one-msix-validation'
          Remove-Item -Path $unpackDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $unpackDir -Force | Out-Null

          & $makeAppx.FullName unpack /p $msix.FullName /d $unpackDir /o | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx unpack failed with exit code $LASTEXITCODE"
          }

          [xml]$manifest = Get-Content (Join-Path $unpackDir 'AppxManifest.xml') -Raw
          $publisherDisplayName = $manifest.Package.Properties.PublisherDisplayName
          $identityName = $manifest.Package.Identity.Name
          $publisher = $manifest.Package.Identity.Publisher

          if ($publisherDisplayName -ne $env:STORE_PUBLISHER_DISPLAY_NAME) {
            throw "PublisherDisplayName is '$publisherDisplayName'; expected '$env:STORE_PUBLISHER_DISPLAY_NAME'."
          }
          if ($identityName -ne $env:STORE_IDENTITY_NAME) {
            throw "Identity name is '$identityName'; expected '$env:STORE_IDENTITY_NAME'."
          }
          if ($publisher -ne $env:WINDOWS_MSIX_PUBLISHER) {
            throw "Publisher is '$publisher'; it does not match WINDOWS_MSIX_PUBLISHER."
          }

          Write-Host "Validated PublisherDisplayName: $publisherDisplayName"
          Write-Host "Validated Identity Name: $identityName"
          Write-Host "Validated Publisher: $publisher"

      - name: Upload validated Store package
        uses: actions/upload-artifact@v4
        with:
          name: Naza-One-Microsoft-Store-MSIX
          path: build/windows/**/*.msix
          if-no-files-found: error
