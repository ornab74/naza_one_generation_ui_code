name: Package v7 source

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9ed89cd0b29cd1ef5c5dd3b556de2ddb6d6a1f3
      - run: grep -q 'version: 7.0.77+7' pubspec.yaml
      - run: zip -qr naza-route-engine-v7.0.77-source.zip . -x '.git/*' '*.keystore' '*.jks' 'android/key.properties' 'relay/secrets.db' 'relay/.secrets.key' '.env' '.env.*'
      - uses: actions/upload-artifact@v4
        with:
          name: naza-route-engine-v7.0.77-source
          path: naza-route-engine-v7.0.77-source.zip
