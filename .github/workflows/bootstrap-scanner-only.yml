name: Bootstrap scanner-only branch
on:
  push:
    branches: ["build/naza-scanner-solo-stores"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-tree:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace branch with scanner payload
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q scanner_payload.zip -d "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -rf "$tmp"
          git config user.name "Graylan Janulis"
          git config user.email "242115042+ornab74@users.noreply.github.com"
          git add -A
          git commit -m "scanner-only multi-platform store build branch"
          git push origin HEAD:build/naza-scanner-solo-stores
