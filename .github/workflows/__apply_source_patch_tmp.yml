name: Temporary source patch

on:
  push:
    branches:
      - fix/memory-defaults-ui-jank

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply source patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/memory-defaults-ui-jank
          fetch-depth: 0
      - name: Patch actual Flutter source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/app.dart')
          s = p.read_text()

          replacements = {
              'static const int memoryRetrievalCandidates = 72;': 'static const int memoryRetrievalCandidates = 108;',
              'static const int memoryAllocationChunks = 6;': 'static const int memoryAllocationChunks = 7;',
              '    this.diversity = 0.28,': '    this.diversity = 0.48,',
              "    final rawDiversity = (json['diversity'] as num?)?.toDouble() ?? 0.28;": "    final rawDiversity = (json['diversity'] as num?)?.toDouble() ?? 0.48;",
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)

          pattern = re.compile(
              r"  Widget _buildPanelStack\(\) \{.*?\n  Widget _panelForStack\(NazaPanel panel\) \{",
              re.S,
          )
          replacement = '''  Widget _buildPanelStack() {
            // Only mount the active workspace. Keeping every heavy panel alive in an
            // IndexedStack forces hidden trees to participate in shell rebuild/layout
            // work and can create UI-thread frame spikes when settings or navigation
            // state changes.
            return KeyedSubtree(
              key: ValueKey<NazaPanel>(_panel),
              child: _panelForStack(_panel),
            );
          }

          Widget _panelForStack(NazaPanel panel) {'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected one _buildPanelStack/_tickerPanel block, found {count}')

          p.write_text(s)
          PY
          dart format lib/app.dart
          git diff --check
          git diff -- lib/app.dart
      - name: Commit source file
        shell: bash
        run: |
          git config user.name 'openai-source-patch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app.dart
          git commit -m 'fix: update memory defaults and reduce UI layout jank [skip ci]'
          git push origin HEAD:fix/memory-defaults-ui-jank
