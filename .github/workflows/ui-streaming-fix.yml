name: Apply chat streaming UI fix

on:
  push:
    paths:
      - '.github/workflows/ui-streaming-fix.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch streaming chat UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text()

          replacements = {
              "          addRepaintBoundaries: false,": "          addRepaintBoundaries: true,",
              """              else if (message.isWorking)\n                Text(\n                  message.text,\n                  style: TextStyle(\n                    color: NazaPalette.text,\n                    fontSize: 14,\n                    height: 1.48,\n                  ),\n                )""": """              else if (message.isWorking)\n                Text(\n                  message.text,\n                  style: TextStyle(\n                    color: NazaPalette.text,\n                    fontSize: 15.8,\n                    height: 1.38,\n                    fontWeight: FontWeight.w600,\n                    fontFamily: NazaFonts.display,\n                  ),\n                )""",
              """              opacity: 0.24,\n            ),\n          ),\n        ),""": """              opacity: 0.16,\n              filterQuality: FilterQuality.low,\n            ),\n          ),\n        ),\n        ColoredBox(\n          color: NazaPalette.inkDeep.withValues(alpha: 0.22),\n        ),""",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          workflow = Path('.github/workflows/ui-streaming-fix.yml')
          workflow.unlink()
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart .github/workflows/ui-streaming-fix.yml
          git commit -m "fix: stabilize chat UI while model streams"
          git push origin HEAD:main
