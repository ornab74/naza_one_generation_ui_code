name: Naza Build Trigger
run-name: Trigger Naza build · ${{ github.event_name }} · ${{ github.ref_name }}

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: naza-build-trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-full-build:
    name: Dispatch full Naza build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record trigger details
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"

      - name: Dispatch Build Naza One
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run flutter-release.yml --ref main
          echo "Dispatched flutter-release.yml on main."

      - name: Validate pull-request trigger
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "Automatic pull-request Actions triggering is operational."
