name: Advanced Memory Branch CI

on:
  push:
    branches:
      - agent/advanced-memory-onboarding
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  validate:
    name: Linux modern runtime + focused tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch modern dependencies
        run: flutter pub get

      - name: Verify non-Windows modern LiteRT-LM bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('pubspec.lock').read_text()
          m = re.search(r'^  flutter_gemma_litertlm:\n(?:.*\n)*?    version: "([^"]+)"', text, re.M)
          if not m:
              raise SystemExit('flutter_gemma_litertlm missing from pubspec.lock')
          resolved = m.group(1)
          print('Linux resolved flutter_gemma_litertlm:', resolved)
          if resolved != '1.3.1':
              raise SystemExit(f'Expected modern non-Windows bridge 1.3.1, got {resolved}')
          PY

      - name: Analyze advanced modules
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/memory/embedded_vector_store.dart
          lib/memory/local_memory_service.dart
          lib/chat/scroll_follow_controller.dart
          lib/chat/history_drawer.dart
          lib/chat/history_metadata_repository.dart
          lib/chat/advanced_chat_coordinator.dart
          lib/model/runtime_profile.dart
          lib/model/model_distribution_manifest.dart
          lib/model/multiplane_model_downloader.dart
          lib/onboarding/first_run_onboarding.dart
          lib/onboarding/onboarding_state.dart
          test/embedded_vector_store_test.dart
          test/local_memory_service_test.dart
          test/history_metadata_repository_test.dart
          test/advanced_chat_coordinator_test.dart
          test/runtime_profile_test.dart
          test/advanced_chat_features_test.dart
          test/model_distribution_manifest_test.dart

      - name: Run embedded vector-store tests
        run: flutter test --no-pub test/embedded_vector_store_test.dart

      - name: Run encrypted memory-service tests
        run: flutter test --no-pub test/local_memory_service_test.dart

      - name: Run encrypted history metadata tests
        run: flutter test --no-pub test/history_metadata_repository_test.dart

      - name: Run advanced chat coordinator tests
        run: flutter test --no-pub test/advanced_chat_coordinator_test.dart

      - name: Run runtime telemetry tests
        run: flutter test --no-pub test/runtime_profile_test.dart

      - name: Run advanced chat feature tests
        run: flutter test --no-pub test/advanced_chat_features_test.dart

      - name: Run model distribution manifest tests
        run: flutter test --no-pub test/model_distribution_manifest_test.dart

  windows-modern-api:
    name: Windows modern 1.3.1 API compile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch modern dependencies
        run: flutter pub get

      - name: Verify Windows uses modern Dart bridge
        shell: pwsh
        run: |
          $lock = Get-Content pubspec.lock -Raw
          if ($lock -notmatch '(?ms)^  flutter_gemma_litertlm:\r?\n.*?    version: "1\.3\.1"') {
            throw 'Windows did not resolve flutter_gemma_litertlm 1.3.1.'
          }
          Write-Host 'PASS: Windows Dart API resolves flutter_gemma_litertlm 1.3.1'

      - name: Analyze Windows sources
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run regression tests on Windows
        run: flutter test --no-pub

      - name: Compile Windows release against modern API
        run: flutter build windows --release --no-pub
