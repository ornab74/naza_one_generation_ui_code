name: Build Naza One

on:
  workflow_dispatch:
    inputs:
      platform:
        description: What should this manual run build?
        required: true
        default: all
        type: choice
        options:
          - all
          - analyze
          - android
          - linux
          - windows
          - macos
          - ios

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.4"
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: Analyze + regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run regression tests
        run: flutter test --no-pub

  android:
    name: Android APK/AAB
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release --no-pub
      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Naza-One-Android
          retention-days: 3
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  linux:
    name: Linux x64
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Package Linux bundle
        run: tar -czf naza-one-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naza-One-Linux-x64
          retention-days: 3
          path: naza-one-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Package Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath naza-one-windows-x64.zip -Force
      - name: Build Windows MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed with exit code $LASTEXITCODE" }
          }
          $wixDir = Split-Path (Get-Command candle.exe -ErrorAction Stop).Source
          $releaseDir = (Resolve-Path "$PWD\build\windows\x64\runner\Release").Path
          $installerDir = "$PWD\installer"
          $iconPath = (Resolve-Path "$PWD\windows\runner\resources\app_icon.ico").Path
          New-Item -ItemType Directory -Path $installerDir -Force | Out-Null
          $versionLine = Get-Content pubspec.yaml | Select-String '^version:' | Select-Object -First 1
          if (-not $versionLine) { throw 'pubspec version not found' }
          $version = ($versionLine -replace '^version:\s*', '').Split('+')[0]
          if ($version -match '^\d+\.\d+\.\d+$') { $version = "$version.0" }
          $productWxs = @"
          <?xml version='1.0' encoding='UTF-8'?>
          <Wix xmlns='http://schemas.microsoft.com/wix/2006/wi'>
            <Product Id='*' Name='Naza One' Language='1033' Version='$version' Manufacturer='Naza' UpgradeCode='D4F4A2E4-7E74-4D06-8E45-0A8CD1BA1C2E'>
              <Package InstallerVersion='500' Compressed='yes' InstallScope='perMachine' />
              <MediaTemplate />
              <MajorUpgrade DowngradeErrorMessage='A newer version of [ProductName] is already installed.' />
              <Icon Id='NazaOneIcon' SourceFile='$iconPath' />
              <Property Id='ARPPRODUCTICON' Value='NazaOneIcon' />
              <Property Id='ARPHELPLINK' Value='https://github.com/ornab74/naza_one_generation_ui_code' />
              <UIRef Id='WixUI_Minimal' />
              <Directory Id='TARGETDIR' Name='SourceDir'>
                <Directory Id='ProgramFilesFolder'>
                  <Directory Id='INSTALLFOLDER' Name='Naza One' />
                </Directory>
              </Directory>
              <Feature Id='ProductFeature' Title='Naza One' Level='1'>
                <ComponentGroupRef Id='AppFiles' />
              </Feature>
            </Product>
          </Wix>
          "@
          Set-Content -Path "$installerDir\Product.wxs" -Value $productWxs -Encoding UTF8
          $appFilesPath = "$installerDir\AppFiles.wxs"
          & "$wixDir\heat.exe" dir "$releaseDir" -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -cg AppFiles -out $appFilesPath
          if ($LASTEXITCODE -ne 0) { throw "heat.exe failed with exit code $LASTEXITCODE" }
          $appFilesXml = Get-Content $appFilesPath -Raw
          $escapedReleaseDir = $releaseDir.Replace('&', '&amp;').Replace("'", '&apos;').Replace('"', '&quot;')
          $appFilesXml = $appFilesXml.Replace('SourceDir\', "$escapedReleaseDir\")
          Set-Content -Path $appFilesPath -Value $appFilesXml -Encoding UTF8
          & "$wixDir\candle.exe" -out "$installerDir\" "$installerDir\Product.wxs" $appFilesPath
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed with exit code $LASTEXITCODE" }
          & "$wixDir\light.exe" -ext WixUIExtension -cultures:en-us -out "naza-one-windows-x64.msi" "$installerDir\Product.wixobj" "$installerDir\AppFiles.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed with exit code $LASTEXITCODE" }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Naza-One-Windows-x64
          retention-days: 3
          path: |
            naza-one-windows-x64.zip
            naza-one-windows-x64.msi
          if-no-files-found: error

  macos:
    name: macOS
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build macOS release
        run: flutter build macos --release --no-pub
      - name: Package macOS app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" naza-one-macos.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naza-One-macOS
          retention-days: 3
          path: naza-one-macos.zip
          if-no-files-found: error

  ios:
    name: iOS unsigned app
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-15
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app naza-one-ios-unsigned-app.zip
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naza-One-iOS-Unsigned
          retention-days: 3
          path: naza-one-ios-unsigned-app.zip
          if-no-files-found: error
